[program:zoria-telegram-pi]
directory=/home/workspace/Projects/zoria-telegram-pi
command=/usr/bin/env bash -lc "cd /home/workspace/Projects/zoria-telegram-pi && npm run start"
autostart=false
autorestart=true
startsecs=5
startretries=5
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/workspace/Projects/zoria-telegram-pi/supervisord/zoria-telegram-pi.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
environment=HOME="/home/workspace",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
